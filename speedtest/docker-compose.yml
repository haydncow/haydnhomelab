# Speedtest Tracker: tests my broadband every 2 hours and graphs it
#
# Its web page is on port 80 inside the container, which Pi-hole already uses,
# so it only listens on the Pi itself (127.0.0.1:8765). Caddy passes it through
# on port 8766, and UFW only allows 8766 from my home network and Tailscale.
services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    env_file: .env          # APP_KEY lives here, on the Pi only
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - DISPLAY_TIMEZONE=Europe/London
      - APP_URL=http://speed.lan
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */2 * * *
      - PRUNE_RESULTS_OLDER_THAN=90
    volumes:
      - ./data:/config
    ports:
      - 127.0.0.1:8765:80
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
