# Scans every commit in this repo for passwords, API keys and tokens,
# so a secret can't sit on GitHub without me knowing.
# Runs on every push, and every Monday in case the scanner's rules improve.
# Written by Claude (AI).
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the whole history, not just the latest commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum checked so the download can't be swapped)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan every commit for secrets
        run: ./gitleaks git . --redact --verbose --exit-code 1
