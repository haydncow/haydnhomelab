# My private homelab dashboard (gethomepage.dev)
#
# network_mode: host means the container uses the Pi's own network, so UFW
# controls who can reach it. Normally Docker publishes ports with its own
# firewall rules that skip UFW completely, which would open it to everyone.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    network_mode: host
    restart: unless-stopped
    env_file: .env          # secrets live here, on the Pi only, never on GitHub
    environment:
      PORT: "3000"
      # Homepage refuses requests for any other address, to stop DNS rebinding attacks
      HOMEPAGE_ALLOWED_HOSTS: "dashboard.lan,192.168.1.5:3000,homelab.local:3000,homelab:3000,100.110.215.83:3000,localhost:3000"
    volumes:
      - ./config:/app/config
      - /mnt/media:/mnt/media:ro     # read-only, just so it can show free space
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
