- Homelab:
    - Pi-hole:
        icon: pi-hole.png
        href: http://pihole.lan
        description: Network ad blocking
        siteMonitor: http://127.0.0.1:8090/admin/
        widget:
          type: pihole
          url: http://127.0.0.1:8090
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.lan
        description: My own Netflix
        siteMonitor: http://127.0.0.1:8096
        widget:
          type: jellyfin
          version: 2          # newer Jellyfin removed the old /emby paths
          url: http://127.0.0.1:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - Speedtest:
        icon: speedtest-tracker.png
        href: http://speed.lan
        description: Broadband speed every 2 hours
        siteMonitor: http://127.0.0.1:8765
        widget:
          type: speedtest
          version: 2
          url: http://127.0.0.1:8765
          key: "{{HOMEPAGE_VAR_SPEEDTEST_KEY}}"

    - EE hub:
        icon: mdi-router-wireless
        href: http://192.168.1.254
        description: Home router admin

- Security:
    - Honeypot:
        icon: mdi-bee
        href: https://haydnhomelab.com/lab/
        description: Fake SSH, Remote Desktop and NAS login
        widget:
          type: customapi
          url: http://127.0.0.1:8080/stats.json   # my own stats, from Caddy on the Pi
          refreshInterval: 60000
          mappings:
            - field: { honeypot: today }
              label: Alerts today
              format: number
            - field: { honeypot: total }
              label: All time
              format: number

    - Vulnerability scan:
        icon: mdi-shield-search
        href: https://haydnhomelab.com/status/
        description: Trivy checks my Docker apps every Monday
        widget:
          type: customapi
          url: http://127.0.0.1:8080/stats.json
          refreshInterval: 300000
          mappings:
            - field: { security: cve_critical }
              label: Critical
              format: number
            - field: { security: cve_high }
              label: High
              format: number

    - CrowdSec:
        icon: crowdsec.png
        href: https://app.crowdsec.net
        description: Spots attacks in my logs and blocks them
        widget:
          type: customapi
          url: http://127.0.0.1:8080/stats.json
          refreshInterval: 60000
          mappings:
            - field: { security: crowdsec_blocked }
              label: IPs blocked
              format: number

    - Live lab:
        icon: mdi-chart-box-outline
        href: https://haydnhomelab.com/lab/
        description: My public dashboard
        siteMonitor: https://haydnhomelab.com
        widget:
          type: customapi
          url: http://127.0.0.1:8080/stats.json
          refreshInterval: 60000
          mappings:
            - field: { visitors: today }
              label: Visitors today
              format: number
            - field: { visitors: week }
              label: This week
              format: number

    - Power:
        icon: mdi-lightning-bolt
        href: https://haydnhomelab.com/lab/
        description: Measured by the Pi 5's power chip
        widget:
          type: customapi
          url: http://127.0.0.1:8080/stats.json
          refreshInterval: 30000
          mappings:
            - field: power
              label: Now
            - field: cost_year
              label: Per year

    - Status page:
        icon: mdi-list-status
        href: https://haydnhomelab.com/status/
        description: 90-day uptime for every service

    - Phone alerts:
        icon: mdi-bell-ring
        href: https://ntfy.sh/app
        description: ntfy, if anything goes down or the honeypot is touched

- Remote:
    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: My devices and exit node

    - Cloudflare:
        icon: cloudflare.png
        href: https://dash.cloudflare.com
        description: Domain and tunnel

    - GitHub:
        icon: github.png
        href: https://github.com/haydncow/haydnhomelab
        description: This project

