- Homelab:
    - Pi-hole:
        icon: pi-hole.png
        href: http://pihole.lan
        description: Network ad blocking
        widget:
          type: pihole
          url: http://127.0.0.1:8090
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.lan
        description: My own Netflix
        siteMonitor: http://127.0.0.1:8096
        widget:
          type: jellyfin
          version: 2          # newer Jellyfin removed the old /emby paths
          url: http://127.0.0.1:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - Speedtest:
        icon: speedtest-tracker.png
        href: http://speed.lan
        description: Broadband speed every 2 hours
        widget:
          type: speedtest
          version: 2
          url: http://127.0.0.1:8765
          key: "{{HOMEPAGE_VAR_SPEEDTEST_KEY}}"

    - Status page:
        icon: mdi-rack-server
        href: https://haydnhomelab.com
        description: My public live dashboard
        siteMonitor: https://haydnhomelab.com

    - EE hub:
        icon: mdi-router-wireless
        href: http://192.168.1.254
        description: Home router admin

- Remote:
    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: My devices and exit node

    - Cloudflare:
        icon: cloudflare.png
        href: https://dash.cloudflare.com
        description: Domain and tunnel

    - GitHub:
        icon: github.png
        href: https://github.com/haydncow/haydnhomelab
        description: This project

